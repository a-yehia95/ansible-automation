- name: primary server is deployed
  hosts: primary_dns
  become: true

  tasks:
    - name: bind is installed
      ansible.builtin.dnf:
        name: bind
        state: present

    - name: named configuration is correct
      ansible.builtin.copy:
        src: named-primary.conf
        dest: /etc/named.conf
        owner: root
        group: named
        mode: '0640'
        setype: named_conf_t
      notify:
        - restart named

    - name: primary zone files are correct
      ansible.builtin.copy:
        src: zone-files/
        dest: /var/named
        owner: root
        group: named
        mode: '0640'
        setype: named_zone_t
      notify:
        - reload named

    - name: named is started and enabled
      ansible.builtin.service:
        name: named
        state: started
        enabled: true

    - name: dns is enabled on the firewall
      ansible.posix.firewalld:
        service: dns
        state: enabled
        immediate: true
        permanent: true

  handlers:
    - name: restart named
      ansible.builtin.service:
        name: named
        state: restarted

    - name: reload named
      ansible.builtin.service:
        name: named
        state: reloaded