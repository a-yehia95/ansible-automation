- name: Unbound is deployed on caching nameservers
  hosts: caching_dns
  become: true

  tasks:
    - name: unbound is installed
      ansible.builtin.dnf:
        name: unbound
        state: present

    - name: unbound configuration is correct
      ansible.builtin.template:
        src: server.conf.j2
        dest: /etc/unbound/conf.d/server.conf
        owner: root
        group: unbound
        mode: '0644'
        setype: named_conf_t
      notify:
        - restart unbound

    - name: unbound is started and enabled
      ansible.builtin.service:
        name: unbound
        state: started
        enabled: true

    - name: dns is enabled on the firewall
      ansible.posix.firewalld:
        service: dns
        state: enabled
        immediate: true
        permanent: true

  handlers:
    - name: restart unbound
      ansible.builtin.service:
        name: unbound
        state: restarted