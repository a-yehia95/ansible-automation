---
# ==============================================================================
# Role: cis_system_settings - System Settings and Kernel Hardening
# ==============================================================================
# Purpose: Configure kernel parameters, core dumps, and system security settings

- name: CIS 2.1 - Configure kernel parameters
  block:
    - name: Configure kernel randomization (CIS 2.1.1)
      sysctl:
        name: kernel.randomize_va_space
        value: "2"
        state: present
        sysctl_set: true
      tags:
        - cis_2_1_1
        - kernel_params

    - name: Configure ptrace scope (CIS 2.1.2)
      sysctl:
        name: kernel.yama.ptrace_scope
        value: "2"
        state: present
        sysctl_set: true
      tags:
        - cis_2_1_2
        - kernel_params

    - name: Configure kernel pointer exposure (CIS 2.1.3)
      sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        sysctl_set: true
      loop:
        - kernel.kptr_restrict
        - kernel.dmesg_restrict
      tags:
        - cis_2_1_3
        - kernel_params

    - name: Configure unprivileged BPF (CIS 2.1.4)
      sysctl:
        name: kernel.unprivileged_bpf_disabled
        value: "1"
        state: present
        sysctl_set: true
      tags:
        - cis_2_1_4
        - kernel_params

    - name: Configure unprivileged user namespaces (CIS 2.1.5)
      sysctl:
        name: kernel.unprivileged_userns_clone
        value: "0"
        state: present
        sysctl_set: true
      tags:
        - cis_2_1_5
        - kernel_params

    - name: Display kernel parameters configuration
      debug:
        msg: "Kernel parameters hardened for enhanced security"
      tags:
        - kernel_params
        - always

  tags:
    - cis_2_1
    - system_settings

- name: CIS 2.2 - Restrict core dumps
  block:
    - name: Disable core dumps via sysctl (CIS 2.2.1)
      sysctl:
        name: fs.suid_dumpable
        value: "0"
        state: present
        sysctl_set: true
      tags:
        - cis_2_2_1
        - core_dumps

    - name: Configure coredump limit in /etc/security/limits.conf (CIS 2.2.2)
      lineinfile:
        path: /etc/security/limits.conf
        line: "* soft core 0"
        state: present
      tags:
        - cis_2_2_2
        - core_dumps

    - name: Configure core dump storage
      lineinfile:
        path: /etc/security/limits.conf
        line: "* hard core 0"
        state: present
      tags:
        - cis_2_2
        - core_dumps

    - name: Display core dump restriction configuration
      debug:
        msg: "Core dumps restricted to prevent sensitive information leakage"
      tags:
        - core_dumps
        - always

  tags:
    - cis_2_2
    - system_settings

- name: CIS 2.3 - SELinux Configuration
  block:
    - name: Install selinux-policy (CIS 2.3.1)
      package:
        name:
          - selinux-policy
          - selinux-policy-targeted
        state: present
      tags:
        - cis_2_3_1
        - selinux

    - name: Configure SELinux policy
      selinux:
        policy: "{{ cis_system_settings.selinux_policy }}"
        state: "{{ cis_system_settings.selinux_mode }}"
      tags:
        - cis_2_3
        - selinux

    - name: Display SELinux configuration
      debug:
        msg: "SELinux configured - Policy: {{ cis_system_settings.selinux_policy }}, Mode: {{ cis_system_settings.selinux_mode }}"
      tags:
        - selinux
        - always

  tags:
    - cis_2_3
    - selinux

- name: CIS 2.4 - Configure kernel modules
  block:
    - name: Disable uncommon network protocols
      modprobe:
        name: "{{ item }}"
        state: absent
      loop:
        - dccp
        - sctp
        - rds
        - tipc
      failed_when: false
      tags:
        - cis_2_4
        - kernel_modules

    - name: Display kernel modules configuration
      debug:
        msg: "Uncommon network protocols disabled"
      tags:
        - kernel_modules
        - always

  tags:
    - cis_2_4
    - system_settings

- name: Summary - System Settings and Kernel Hardening
  debug:
    msg: |
      =====================================================================
      System Settings and Kernel Hardening Summary:
      =====================================================================
      ✓ Kernel parameters hardened (ASLR, ptrace, BPF, namespaces)
      ✓ Core dumps restricted
      ✓ SELinux configured and enforcing
      ✓ Uncommon network protocols disabled
      ✓ System security enhanced
      =====================================================================
  tags:
    - always
    - system_settings
