---
# ==============================================================================
# Role: cis_file_permissions - Default Variables
# ==============================================================================

cis_file_permissions:
  # System file permissions to enforce
  files_to_check:
    - path: /etc/passwd
      owner: root
      group: root
      mode: "0644"
    - path: /etc/shadow
      owner: root
      group: root
      mode: "0600"
    - path: /etc/group
      owner: root
      group: root
      mode: "0644"
    - path: /etc/gshadow
      owner: root
      group: root
      mode: "0600"
    - path: /etc/ssh/sshd_config
      owner: root
      group: root
      mode: "0600"
    - path: /etc/sudoers
      owner: root
      group: root
      mode: "0440"
  
  # World-writable directories to check
  check_world_writable: true
  
  # Unowned files check
  check_unowned_files: true
  
  # SUID/SGID/Sticky bit checks
  check_suid_sgid: true

enable_file_permissions: true
