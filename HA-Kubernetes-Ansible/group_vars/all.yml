---
# ==============================================================================
# Group Variables for All Hosts
# ==============================================================================
# These variables apply to all hosts in the Kubernetes cluster

# ==============================================================================
# Kubernetes Cluster Configuration
# ==============================================================================

# Kubernetes version
kubernetes_version: "1.28.0"

# Cluster name
cluster_name: "kubernetes"

# Virtual IP for load balanced API server
loadbalancer_vip: "10.0.0.100"

# ==============================================================================
# Network Configuration
# ==============================================================================

# Pod CIDR for CNI plugin
pod_network_cidr: "10.244.0.0/16"

# Service CIDR for ClusterIP services
service_network_cidr: "10.96.0.0/12"

# Cluster DNS
cluster_dns: "10.96.0.10"

# Cluster domain
cluster_domain: "cluster.local"

# ==============================================================================
# SSL/TLS Configuration
# ==============================================================================

# Path for SSL certificates
ssl_cert_path: "/etc/kubernetes/pki"

# Certificate validity
certificate_validity_days: 3650

# ==============================================================================
# Container Runtime Configuration
# ==============================================================================

# Container runtime type: containerd, docker
container_runtime: "containerd"

# Containerd version
containerd_version: "1.7.4"

# CNI plugins version
cni_plugins_version: "1.3.0"

# ==============================================================================
# System Configuration
# ==============================================================================

# Disable swap (required for Kubernetes)
disable_swap: true

# SELinux state: disabled, permissive, enforcing
selinux_state: "disabled"

# System packages to install
system_packages:
  - curl
  - wget
  - git
  - unzip
  - jq
  - net-tools
  - vim
  - htop
  - tar
  - gzip
  - openssl
  - conntrack
  - socat
  - ipset

# ==============================================================================
# Kubelet Configuration
# ==============================================================================

# Maximum number of pods per node
kubelet_max_pods: 110

# System reserved resources
kubelet_system_reserved_cpu: "100m"
kubelet_system_reserved_memory: "100Mi"

# ==============================================================================
# API Server Configuration
# ==============================================================================

# API server port
api_server_port: 6443

# Audit logging
enable_audit_logs: true
audit_log_maxage: 30
audit_log_maxbackup: 10
audit_log_maxsize: 100

# ==============================================================================
# Backup Configuration
# ==============================================================================

# Enable backups
enable_backups: true

# Backup retention days
backup_retention_days: 30

# Backup paths
etcd_backup_path: "/var/backups/etcd"
kubernetes_backup_path: "/var/backups/kubernetes"

# ==============================================================================
# Feature Gates (Advanced Kubernetes Features)
# ==============================================================================

feature_gates:
  - "IPv6DualStack=true"
  - "EphemeralContainers=true"

# ==============================================================================
# Admission Controllers
# ==============================================================================

admission_controllers:
  - "NodeRestriction"
  - "PodSecurityPolicy"
  - "ServiceAccount"
  - "NamespaceLifecycle"
  - "LimitRanger"
  - "ResourceQuota"

# ==============================================================================
# Load Balancer Configuration
# ==============================================================================

# HAProxy port
haproxy_port: 6443

# HAProxy stats port
haproxy_stats_port: 8404

# Keepalived VRRP password
keepalived_auth_pass: "kubernetes"

# Health check settings
health_check_interval: 5
health_check_timeout: 3
health_check_fall: 3
health_check_rise: 2

# ==============================================================================
# Logging
# ==============================================================================

# Logging level
logging_level: "info"

# Enable cluster logging
enable_cluster_logging: true

# ==============================================================================
# Repository URLs
# ==============================================================================

kubernetes_repo_key_url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
kubernetes_repo_url: "https://packages.cloud.google.com/apt"

# ==============================================================================
# Proxy Configuration (for restricted environments)
# ==============================================================================

http_proxy: ""
https_proxy: ""
no_proxy: "localhost,127.0.0.1"
