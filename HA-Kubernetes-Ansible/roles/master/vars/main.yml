---
# ==============================================================================
# Master Role Variables
# ==============================================================================

# Master node configuration
master_count: "{{ groups['master'] | length }}"

# API Server configuration
api_server_bind_port: 6443

# kubelet configuration
kubelet_max_pods: 110
kubelet_system_reserved_cpu: "100m"
kubelet_system_reserved_memory: "100Mi"
kubelet_kubeadm_node_labels: "node-role.kubernetes.io/master="

# Admission controllers
admission_controllers:
  - "NodeRestriction"
  - "PodSecurityPolicy"
  - "ServiceAccount"
  - "NamespaceLifecycle"
  - "LimitRanger"
  - "ResourceQuota"
