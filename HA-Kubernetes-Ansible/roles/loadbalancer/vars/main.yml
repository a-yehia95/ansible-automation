---
# ==============================================================================
# Load Balancer Role Variables
# ==============================================================================

# Virtual IP for load balancer (floating IP)
loadbalancer_vip: "10.0.0.100"  # Change to your environment
loadbalancer_interface: "eth0"  # Change to your network interface

# Keepalived priority (higher number = higher priority, primary should be 100)
keepalived_priority_primary: 100
keepalived_priority_backup: 90

# Keepalived authentication
keepalived_auth_pass: "kubernetes"

# HAProxy configuration
haproxy_port: 6443
haproxy_stats_port: 8404
haproxy_stats_enabled: true

# Health check settings
health_check_interval: 5
health_check_timeout: 3
health_check_fall: 3
health_check_rise: 2
