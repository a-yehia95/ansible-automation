---
# ==============================================================================
# Calico CNI Role - Main Task File
# ==============================================================================
# Purpose: Install and configure Calico as the Container Network Interface (CNI)
# NOTE: This is integrated into kubeadm-init role. This role provides alternative deployment.
# ==============================================================================

- name: Check if Calico is already installed
  block:
    - name: Check for Tigera operator namespace
      command: kubectl get namespace tigera-operator
      register: calico_check
      changed_when: false
      failed_when: false

- name: Install Calico if not present
  block:
    - name: Create CNI manifest directory
      file:
        path: /tmp/calico
        state: directory
        mode: "0755"
      when: calico_check.rc != 0

    - name: Download Calico operator manifest
      get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/v3.26.0/manifests/tigera-operator.yaml"
        dest: /tmp/calico/tigera-operator.yaml
        mode: "0644"
      register: calico_download
      changed_when: calico_download.changed
      retries: 3
      delay: 10
      when: calico_check.rc != 0

    - name: Apply Tigera operator
      command: kubectl apply -f /tmp/calico/tigera-operator.yaml
      register: operator_apply
      changed_when: "'created' in operator_apply.stdout or 'configured' in operator_apply.stdout"
      when: calico_check.rc != 0

    - name: Wait for Tigera operator to be ready
      command: >
        kubectl wait --for=condition=ready pod 
        -l k8s-app=tigera-operator 
        -n tigera-operator 
        --timeout=300s
      register: operator_ready
      changed_when: false
      retries: 3
      delay: 10
      when: calico_check.rc != 0 and operator_apply.changed

    - name: Create Calico installation manifest
      template:
        src: calico-installation.yaml.j2
        dest: /tmp/calico/calico-installation.yaml
        mode: "0644"
      when: calico_check.rc != 0

    - name: Apply Calico installation
      command: kubectl apply -f /tmp/calico/calico-installation.yaml
      register: calico_apply
      changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"
      when: calico_check.rc != 0

  when: inventory_hostname == groups['masters'][0]

- name: Verify Calico deployment
  block:
    - name: Wait for Calico nodes to be ready
      command: >
        kubectl wait --for=condition=ready node 
        --all 
        --timeout=600s
      register: nodes_ready
      changed_when: false
      retries: 5
      delay: 30

    - name: Get Calico node status
      command: kubectl get pods -n calico-system -o wide
      register: calico_status
      changed_when: false
      failed_when: false

    - name: Display Calico status
      debug:
        msg:
          - "✓ Calico CNI Installed"
          - "{{ calico_status.stdout }}"
