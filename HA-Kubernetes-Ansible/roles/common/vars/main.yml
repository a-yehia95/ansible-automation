---
# ==============================================================================
# Common Role Variables
# ==============================================================================
# These variables are used across all nodes in the Kubernetes cluster

# ==============================================================================
# Kubernetes Version Configuration
# ==============================================================================
kubernetes_version: "1.28.0"
kubeadm_version: "1.28.0"
kubelet_version: "1.28.0"
kubectl_version: "1.28.0"

# Container runtime version
containerd_version: "1.7.4"
cni_plugins_version: "1.3.0"

# ==============================================================================
# Network Configuration
# ==============================================================================
# Pod network CIDR (used by CNI plugin)
pod_network_cidr: "10.244.0.0/16"

# Service network CIDR
service_network_cidr: "10.96.0.0/12"

# DNS domain for cluster
cluster_domain: "cluster.local"
cluster_dns: "10.96.0.10"

# ==============================================================================
# User and Group Configuration
# ==============================================================================
kube_user: "kubernetes"
kube_group: "kubernetes"

# ==============================================================================
# SSL/TLS Configuration
# ==============================================================================
# Path for SSL certificates
ssl_cert_path: "/etc/kubernetes/pki"
etcd_cert_path: "/etc/kubernetes/pki/etcd"

# Certificate validity period (in days)
certificate_validity_days: 3650

# ==============================================================================
# Package Repository Configuration
# ==============================================================================
# APT/YUM repository URLs (will be configured based on OS)
kubernetes_repo_key_url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
kubernetes_repo_url: "https://packages.cloud.google.com/apt"

# ==============================================================================
# Docker/Containerd Configuration
# ==============================================================================
container_runtime: "containerd"  # Options: containerd, docker
container_runtime_socket: "/run/containerd/containerd.sock"

# ==============================================================================
# System Configuration
# ==============================================================================
# System limits
max_open_files: 2000000
max_file_descriptors: 2000000

# Swap configuration (should be disabled for Kubernetes)
disable_swap: true

# SELinux configuration (disable for easier setup, use permissive in production)
selinux_state: "disabled"

# ==============================================================================
# System Packages Required
# ==============================================================================
system_packages:
  - curl
  - wget
  - git
  - unzip
  - jq
  - net-tools
  - vim
  - htop
  - tar
  - gzip
  - openssl
  - conntrack
  - socat
  - ipset

# ==============================================================================
# Kubelet Configuration
# ==============================================================================
# Node hostname override (leave empty to use actual hostname)
node_hostname: ""

# Kubelet extra arguments
kubelet_extra_args: "--network-plugin=cni --cni-conf-dir=/etc/cni/net.d --cni-bin-dir=/opt/cni/bin"

# ==============================================================================
# Audit Logging Configuration
# ==============================================================================
enable_audit_logs: true
audit_log_maxage: 30
audit_log_maxbackup: 10
audit_log_maxsize: 100

# ==============================================================================
# Logging and Monitoring
# ==============================================================================
enable_cluster_logging: true
log_level: "2"  # 0=panic, 1=error, 2=warn, 3=info, 4=debug

# ==============================================================================
# Feature Gates
# ==============================================================================
# Advanced Kubernetes features
feature_gates:
  - "IPv6DualStack=true"
  - "EphemeralContainers=true"

# ==============================================================================
# API Server Configuration
# ==============================================================================
api_server_port: 6443
api_server_extra_args: ""

# ==============================================================================
# Scheduler Configuration
# ==============================================================================
scheduler_extra_args: ""

# ==============================================================================
# Controller Manager Configuration
# ==============================================================================
controller_manager_extra_args: ""

# ==============================================================================
# Proxy Configuration
# ==============================================================================
# HTTP proxy settings (if needed in restricted environments)
http_proxy: ""
https_proxy: ""
no_proxy: "localhost,127.0.0.1"

# ==============================================================================
# SSH Configuration
# ==============================================================================
ssh_port: 22
ansible_user_default: "root"

# ==============================================================================
# Backup Configuration
# ==============================================================================
enable_backups: true
backup_retention_days: 30
etcd_backup_path: "/var/backups/etcd"
kubernetes_backup_path: "/var/backups/kubernetes"

# ==============================================================================
# NTP Configuration
# ==============================================================================
ntp_enabled: true
ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"
  - "2.pool.ntp.org"

# ==============================================================================
# Logging Configuration
# ==============================================================================
syslog_enabled: true
logging_level: "info"  # trace, debug, info, warn, error, fatal, panic
