# ==============================================================================
# HA Kubernetes Cluster Inventory
# ==============================================================================
# Deploy a 3-Master + 2-Worker HA Kubernetes cluster on RHEL 9.7
# ==============================================================================

[all:vars]
# Common variables for all hosts
ansible_user=root
ansible_password={{ ansible_password }}  # Set via ansible-vault or command line
ansible_port=22
ansible_connection=ssh

# Kubernetes Configuration
kubernetes_version=1.28.0
kubeadm_version=1.28.0
kubelet_version=1.28.0
kubectl_version=1.28.0
crio_version=1.28.0

# Cluster Configuration
cluster_name=ha-k8s-cluster
cluster_cidr=10.244.0.0/16
service_cidr=10.96.0.0/12
kubernetes_api_port=6443
control_plane_endpoint_port=6443

# HA Configuration
control_plane_vip=10.0.0.100
control_plane_endpoint=api.k8s.local:{{ control_plane_endpoint_port }}
keepalived_priority_increment=10

# Container Runtime
container_runtime=crio
cri_sock=/run/crio/crio.sock

# Network
pod_network_cidr=10.244.0.0/16
service_network_cidr=10.96.0.0/12

# ==============================================================================
# Master Nodes (Control Plane) - 3 Nodes
# ==============================================================================
[masters]
master01 ansible_host=10.0.0.101
master02 ansible_host=10.0.0.102
master03 ansible_host=10.0.0.103

[masters:vars]
keepalived_priority=100
keepalived_priority_master01=100
keepalived_priority_master02=90
keepalived_priority_master03=80

# ==============================================================================
# Worker Nodes (Data Plane) - 2 Nodes
# ==============================================================================
[workers]
worker01 ansible_host=10.0.0.201
worker02 ansible_host=10.0.0.202

# ==============================================================================
# Load Balancer Nodes (for HA - runs on master nodes)
# ==============================================================================
[loadbalancers]
master01 ansible_host=10.0.0.101
master02 ansible_host=10.0.0.102
master03 ansible_host=10.0.0.103

# ==============================================================================
# Kubernetes Groups
# ==============================================================================
[k8s_nodes:children]
masters
workers

[k8s_masters:children]
masters

[k8s_workers:children]
workers

# ==============================================================================
# First Master (for initialization)
# ==============================================================================
[master_init]
master01 ansible_host=10.0.0.101

[master_init:vars]
is_init_master=true

# ==============================================================================
# Additional Masters (for joining)
# ==============================================================================
[masters_join]
master02 ansible_host=10.0.0.102
master03 ansible_host=10.0.0.103

[masters_join:vars]
is_init_master=false
