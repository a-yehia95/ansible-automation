[defaults]
# ==============================================================================
# Ansible Platform Configuration for Storage Automation
# ==============================================================================

# Inventory
inventory = ./inventory/hosts

# Roles
roles_path = ./roles

# Execution
connection = local
host_key_checking = False
force_color = True
inventory_unparsed_warning = False

# Performance
forks = 10
pipelining = True
strategy = linear
timeout = 300

# Task Output
display_skipped_hosts = False
display_ok_hosts = True
callback_whitelist = profile_tasks, timer, yaml

# Logging
log_path = ./logs/ansible.log

# Error Handling
error_on_undefined_vars = True
strict_inventory_comments = False
any_errors_fatal = False
retries = 3

# Python
interpreter_python = auto_silent

# Jinja2
jinja2_native = True

# SSH (if needed for non-local tasks)
[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
