---
# ==============================================================================
# Storage Automation - Collections & Roles Requirements
# ==============================================================================
# Purpose: Define external Ansible collections and roles for storage
#          vendor automation (Pure Storage, Dell PowerStore)
# Usage:   ansible-galaxy install -r requirements.yml
# ==============================================================================

collections:
  # Pure Storage FlashArray Collection
  # Provides modules for Pure Storage management: volumes, hosts, snapshots
  - name: purestorage.flasharray
    version: ">=1.18.0"
    source: community

  # Dell PowerStore Collection
  # Provides modules for Dell PowerStore management: volumes, hosts, snapshots
  - name: dellemc.powerstore
    version: ">=2.1.0"
    source: community

  # Community General (for utility modules)
  - name: community.general
    version: ">=7.0.0"
    source: community

  # Ansible Built-in Collection (always present, included for clarity)
  - name: ansible.builtin
    version: ">=2.12.0"
    source: community

roles:
  # No external roles required for this project
  # All logic implemented in playbooks and custom blocks
