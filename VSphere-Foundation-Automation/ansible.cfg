# ==============================================================================
# Ansible Configuration for VMware vSphere Foundation Automation
# ==============================================================================
# Production-grade configuration optimized for vmware.rest collection
# Location: ansible.cfg (in project root)

[defaults]
# Inventory configuration
inventory = ./inventory/hosts
inventory_plugins = ./plugins/inventory

# Roles and plugins
roles_path = ./roles
library = ./library
filter_plugins = ./filter_plugins
callback_plugins = ./callback_plugins
lookup_plugins = ./lookup_plugins

# Host key checking - disabled for vCenter (no SSH host verification needed)
host_key_checking = False

# Connection timeout settings
timeout = 300
connect_timeout = 60

# Execution settings
force_handlers = True
gather_facts = no
max_fail_percentage = 0
deprecation_warnings = True

# Performance tuning
forks = 10
internal_poll_interval = 0.001
worker_threads = 5

# Logging and debug
log_path = ./logs/ansible.log
verbosity = 0

# Variable precedence
hash_behaviour = replace

# Templating
jinja2_extensions = jinja2.ext.debug

# Task display settings
display_skipped_hosts = True
display_ok_hosts = True

[privilege_escalation]
# Privilege escalation not needed for vmware.rest collection
become = False

[ssh_connection]
# SSH settings (if needed for OS-level tasks)
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[inventory]
# Allow host pattern overrides
enable_plugins = ini, yaml, aws_ec2
