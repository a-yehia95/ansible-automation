---
# ==============================================================================
# Ansible Galaxy Requirements - Collections
# ==============================================================================
# Install with: ansible-galaxy collection install -r requirements.yml
#
# VMware vSphere Foundation Automation using vmware.rest collection
# Supports vSphere 7.0 and later

collections:
  # VMware REST API Collection (official, vmware-maintained)
  - name: vmware.rest
    version: ">=2.0.0"
    source: https://galaxy.ansible.com

  # Core Ansible Collections
  - name: ansible.builtin
    version: ">=2.13.0"
    source: https://galaxy.ansible.com

  - name: ansible.posix
    version: ">=1.5.0"
    source: https://galaxy.ansible.com

  - name: ansible.netcommon
    version: ">=5.0.0"
    source: https://galaxy.ansible.com

  - name: ansible.utils
    version: ">=2.10.0"
    source: https://galaxy.ansible.com

  # General Utilities
  - name: community.general
    version: ">=7.0.0"
    source: https://galaxy.ansible.com

  # JSON utilities for REST API handling
  - name: community.json_utils
    version: ">=1.0.0"
    source: https://galaxy.ansible.com
