# ==============================================================================
# Ansible Configuration for VMware Automation
# ==============================================================================
# Production-grade Ansible configuration with VMware best practices

[defaults]
# Inventory
inventory = ./inventory/hosts
inventory_plugins = ./plugins/inventory

# Roles
roles_path = ./roles

# Plugins
library = ./library
filter_plugins = ./filter_plugins
callback_plugins = /usr/share/ansible/plugins/callback
lookup_plugins = /usr/share/ansible/plugins/lookup

# SSH Settings
host_key_checking = False
private_key_file = ~/.ssh/id_rsa
remote_user = root
remote_port = 22
timeout = 30

# Connection Settings
transport = ssh
force_handlers = True
gather_facts = yes
gather_subset = all
fact_caching = jsonfile
fact_caching_connection = ./facts
fact_caching_timeout = 3600

# Performance Optimization
forks = 10
max_diff_truncate_size = 80000
internal_poll_interval = 0.001

# Module Defaults
module_defaults_search_path = ./defaults
action_warnings = True

# Privilege Escalation
become = yes
become_method = sudo
become_user = root
become_ask_pass = False

# Output Display
display_args_to_log = False
display_skipped_hosts = True
ansible_managed = "Ansible managed: {file} modified on %Y-%m-%d %H:%M:%S by {uid} on {host}"

# Logging
log_path = ./logs/ansible.log

# Parallelism & Callbacks
strategy = linear
strategy_plugins = /usr/share/ansible/plugins/strategy
callback_whitelist = profile_tasks, timer, junit, dense, yaml, skippy

# Vault
vault_password_file = ./.vault_pass
ask_vault_pass = False

# Error Handling
#any_unparseable_is_failed = False
force_valid_group_chars = ignore

# Deprecation
deprecation_warnings = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = %(directory)s/%%h-%%p-%%r
pipelining = True

[persistent_connection]
connect_timeout = 30
command_timeout = 30
